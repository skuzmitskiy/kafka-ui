apiVersion: v1
kind: Secret
metadata:
  name: kafka-ui-auth
  namespace: kafka-ui
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/component: admin
type: Opaque
stringData:
  # Используются только при первом запуске, когда users.json ещё не создан.
  AUTH_LOCAL_BOOTSTRAP_USERNAME: admin
  AUTH_LOCAL_BOOTSTRAP_PASSWORD: "ChangeMe-kafka-ui"
