services:
  kafka-ui:
    container_name: kafka-ui
    image: ${KAFKA_UI_IMAGE:-kafka-ui-local:latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - 8080:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_UI_CLUSTER_NAME:-local}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_UI_BOOTSTRAP_SERVERS:?Set KAFKA_UI_BOOTSTRAP_SERVERS}
      AUTH_TYPE: LOGIN_FORM
      AUTH_LOCAL_USERS_FILE: /etc/kafkaui/users.json
      AUTH_LOCAL_BOOTSTRAP_USERNAME: ${KAFKA_UI_ADMIN_USERNAME:-admin}
      AUTH_LOCAL_BOOTSTRAP_PASSWORD: ${KAFKA_UI_ADMIN_PASSWORD:?Set KAFKA_UI_ADMIN_PASSWORD}
    volumes:
      - kafka-ui-data:/etc/kafkaui

volumes:
  kafka-ui-data:
    name: kafka-ui-data
