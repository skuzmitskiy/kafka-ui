---
version: '2'
# LDAP auth example for this fork (role-mapped READ / READ_WRITE).
# Build/run image from this branch, e.g.:
#   export KAFKA_UI_IMAGE=kafka-ui-local:latest
# Upstream provectuslabs/kafka-ui does not include this role mapping.
services:

  kafka-ui:
    container_name: kafka-ui
    image: ${KAFKA_UI_IMAGE:-kafka-ui-local:latest}
    ports:
      - 8080:8080
    depends_on:
      - kafka0
      - schemaregistry0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka0:29092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schemaregistry0:8085
      DYNAMIC_CONFIG_ENABLED: "true"

      AUTH_TYPE: "LDAP"
      SPRING_LDAP_URLS: "ldap://ldap:10389"
      SPRING_LDAP_DN_PATTERN: "cn={0},ou=people,dc=planetexpress,dc=com"

      # Map LDAP groups → application roles (HTTP Basic).
      # Without group search, AUTH_LDAP_DEFAULT_ROLE applies (READ by default).
      AUTH_LDAP_READ_GROUP: "ship_crew"
      AUTH_LDAP_READ_WRITE_GROUP: "admin_staff"
      AUTH_LDAP_DEFAULT_ROLE: "READ"
      AUTH_LDAP_GROUP_SEARCH_BASE: "ou=people,dc=planetexpress,dc=com"
      AUTH_LDAP_GROUP_SEARCH_FILTER: "(member={0})"
      AUTH_LDAP_GROUP_ROLE_ATTRIBUTE: "cn"

#     ===== USER SEARCH FILTER INSTEAD OF DN =====
#     SPRING_LDAP_USERFILTER_SEARCHBASE: "dc=planetexpress,dc=com"
#     SPRING_LDAP_USERFILTER_SEARCHFILTER: "(&(uid={0})(objectClass=inetOrgPerson))"
#     SPRING_LDAP_ADMINUSER: "cn=admin,dc=planetexpress,dc=com"
#     SPRING_LDAP_ADMINPASSWORD: "GoodNewsEveryone"

#     ===== ACTIVE DIRECTORY =====
#     AUTH_LDAP_ACTIVE_DIRECTORY_ENABLED: "true"
#     AUTH_LDAP_ACTIVE_DIRECTORY_DOMAIN: "example.com"
#     # Legacy (still supported): OAUTH2_LDAP_ACTIVEDIRECTORY=true
#     # Legacy domain key had a Cyrillic 'с' typo; prefer AUTH_LDAP_ACTIVE_DIRECTORY_DOMAIN.

  ldap:
    image: rroemhild/test-openldap:latest
    hostname: "ldap"

  kafka0:
    image: confluentinc/cp-kafka:7.2.1
    hostname: kafka0
    container_name: kafka0
    ports:
      - "9092:9092"
      - "9997:9997"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka0:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9997
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_JMX_OPTS: -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=kafka0 -Dcom.sun.management.jmxremote.rmi.port=9997
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka0:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka0:29092,CONTROLLER://kafka0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    volumes:
      - ./scripts/update_run.sh:/tmp/update_run.sh
    command: "bash -c 'if [ ! -f /tmp/update_run.sh ]; then echo \"ERROR: Did you forget the update_run.sh file that came with this docker-compose.yml file?\" && exit 1 ; else /tmp/update_run.sh && /etc/confluent/docker/run ; fi'"

  schemaregistry0:
    image: confluentinc/cp-schema-registry:7.2.1
    ports:
      - 8085:8085
    depends_on:
      - kafka0
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka0:29092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT
      SCHEMA_REGISTRY_HOST_NAME: schemaregistry0
      SCHEMA_REGISTRY_LISTENERS: http://schemaregistry0:8085

      SCHEMA_REGISTRY_SCHEMA_REGISTRY_INTER_INSTANCE_PROTOCOL: "http"
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: INFO
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
